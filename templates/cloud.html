<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Files - YouTube Downloader</title>
    <link rel="stylesheet" href="/static/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22.54 6.42a2 2 0 0 0-3.5 0l-9.6 9.6a2 2 0 0 0 0 3.5 0l9.6-9.6a2 2 0 0 0 0-3.5 0m-16.97 0l9.6 9.6a2 2 0 0 0 0 3.5 0l9.6-9.6a2 2 0 0 0 0-3.5 0"></path>
                    </svg>
                    <span>YT Downloader</span>
                </div>
            </div>
            
            <nav class="sidebar-nav"></nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-header">
                <div class="header-title">
                    <h1>Cloud Files</h1>
                    <p class="subtitle">Manage your Backblaze B2 cloud storage</p>
                </div>
            </div>

            <div class="cloud-section">
                <!-- Storage Info Card -->
                <div class="storage-info-card">
                    <div class="storage-info-header">
                        <div class="storage-info-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Storage Usage</span>
                        </div>
                        <button id="storageSettingsBtn" class="btn-icon" title="Storage Settings">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="storage-stats">
                        <div class="storage-stat">
                            <span class="storage-stat-label">Used</span>
                            <span class="storage-stat-value" id="storageUsed">0 GB</span>
                        </div>
                        <div class="storage-stat">
                            <span class="storage-stat-label">Free</span>
                            <span class="storage-stat-value" id="storageFree">0 GB</span>
                        </div>
                        <div class="storage-stat">
                            <span class="storage-stat-label">Limit</span>
                            <span class="storage-stat-value" id="storageLimit">10 GB</span>
                        </div>
                        <div class="storage-stat">
                            <span class="storage-stat-label">Files</span>
                            <span class="storage-stat-value" id="storageFiles">0</span>
                        </div>
                    </div>
                    <div class="storage-progress-container">
                        <div class="storage-progress-bar">
                            <div class="storage-progress-fill" id="storageProgressFill" style="width: 0%"></div>
                        </div>
                        <div class="storage-progress-text">
                            <span id="storagePercentage">0%</span> used
                        </div>
                    </div>
                </div>

                <!-- Storage Analytics -->
                <div class="storage-analytics-card">
                    <div class="analytics-header">
                        <div class="analytics-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="20" x2="18" y2="10"></line>
                                <line x1="12" y1="20" x2="12" y2="4"></line>
                                <line x1="6" y1="20" x2="6" y2="14"></line>
                            </svg>
                            <span>Storage Analytics</span>
                        </div>
                        <button class="btn-icon" id="analyticsToggleBtn" title="Toggle Analytics">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="analyticsToggleIcon">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="analytics-content" id="analyticsContent" style="display: none;">
                        <div class="analytics-chart">
                            <div class="chart-bar-container">
                                <div class="chart-bar" id="usedStorageBar" style="width: 0%"></div>
                            </div>
                            <div class="chart-legend">
                                <div class="legend-item">
                                    <div class="legend-color used"></div>
                                    <span>Used Space</span>
                                </div>
                                <div class="legend-item">
                                    <div class="legend-color free"></div>
                                    <span>Free Space</span>
                                </div>
                            </div>
                        </div>
                        <div class="analytics-stats">
                            <div class="analytics-stat-item">
                                <div class="stat-label">Average File Size</div>
                                <div class="stat-value" id="avgFileSize">0 MB</div>
                            </div>
                            <div class="analytics-stat-item">
                                <div class="stat-label">Largest File</div>
                                <div class="stat-value" id="largestFile">0 MB</div>
                            </div>
                            <div class="analytics-stat-item">
                                <div class="stat-label">Total Files</div>
                                <div class="stat-value" id="totalFiles">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="cloud-controls">
                    <div class="search-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search files...">
                    </div>
                    <div class="filter-controls">
                        <select id="sortFilter" class="filter-select">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="name">Name A-Z</option>
                            <option value="size">Size</option>
                        </select>
                    </div>
                    <button id="refreshBtn" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        Refresh
                    </button>
                    <button id="selectAllBtn" class="btn-secondary" onclick="selectAllFiles()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 11 12 14 22 4"></polyline>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        Select All
                    </button>
                    <button id="deselectAllBtn" class="btn-secondary" onclick="deselectAllFiles()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        Deselect All
                    </button>
                    <button id="bulkDeleteBtn" class="btn-danger" onclick="confirmBulkDelete()" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        Delete Selected
                    </button>
                    <button id="bulkUploadBtn" class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Bulk Upload
                    </button>
                    <input type="file" id="bulkFileInput" multiple accept="image/*,video/*" style="display: none;">
                </div>

                <div id="cloudFilesList" class="cloud-files-list">
                    <!-- Cloud files will be inserted here -->
                </div>
                
                <div id="emptyCloud" class="empty-state hidden">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <h3>No cloud files</h3>
                    <p>Your cloud storage is empty</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/modal.js"></script>
    <script src="/static/sidebar.js"></script>
    <script src="/static/cloud.js"></script>
</body>
</html>
